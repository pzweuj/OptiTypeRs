name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, such as 0.1.0 or v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          number="${REQUESTED_VERSION#v}"
          if [[ ! "$number" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Enter a version such as 0.1.0 or v0.1.0.' >&2
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-22.04
    env:
      OPTITYPE_RELEASE_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable --no-self-update
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libclang-dev ninja-build
          echo 'CMAKE_GENERATOR=Ninja' >> "$GITHUB_ENV"
      - name: Build and test
        shell: bash
        run: |
          cargo +stable build --locked --release
          cargo +stable test --locked --release
          test "$(./target/release/optitype-rs --version)" = "optitype-rs $OPTITYPE_RELEASE_VERSION"
      - name: Package executable and license notices
        shell: bash
        run: |
          cargo +stable vendor --locked target/release-vendor > /dev/null
          python .github/package-release.py linux-x86_64 optitype-rs "$OPTITYPE_RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release/optitype-rs-v${{ needs.version.outputs.number }}-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          name: linux-x86_64
      - name: Publish GitHub Release
        shell: bash
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Tag $tag already exists." >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
          fi
          linux="optitype-rs-$tag-linux-x86_64.tar.gz"
          cd release
          sha256sum "$linux" > SHA256SUMS.txt
          gh release create "$tag" "$linux" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "OptiTypeRs $tag" --generate-notes
