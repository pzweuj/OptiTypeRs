[package]
name = "optitype-rs"
version = "0.1.0"
edition = "2024"
license = "MIT AND BSD-3-Clause"

[dependencies]
anyhow = "1"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
highs = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
